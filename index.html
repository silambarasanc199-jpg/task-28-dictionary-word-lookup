<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dictionary Lookup | Task 28</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <header class="header">
      <div class="brand">
        <div class="brand-icon">⌘</div>

        <div>
          <h1>WORD<span>LOOKUP</span></h1>
          <p>DICTIONARY SYSTEM // TASK 28</p>
        </div>
      </div>

      <div class="status">
        <span></span>
        API ONLINE
      </div>
    </header>


    <section class="search-panel">

      <div class="section-label">
        <span>01</span>
        WORD SEARCH
      </div>

      <div class="search-box">

        <input
          type="text"
          id="wordInput"
          placeholder="Enter a word..."
          autocomplete="off"
        >

        <button id="searchBtn">
          SEARCH
        </button>

      </div>

      <div class="hint">
        Try: <button class="suggestion">technology</button>
        <button class="suggestion">future</button>
        <button class="suggestion">artificial</button>
      </div>

    </section>


    <section id="loading" class="message hidden">
      <div class="loader"></div>
      <p>QUERYING DICTIONARY API...</p>
    </section>


    <section id="errorBox" class="error-box hidden">

      <div class="error-icon">!</div>

      <div>
        <h3>WORD NOT FOUND</h3>
        <p id="errorMessage">
          We couldn't find this word.
        </p>
      </div>

    </section>


    <section id="result" class="result hidden">

      <div class="word-header">

        <div>
          <div class="section-label">
            <span>02</span>
            RESULT
          </div>

          <h2 id="wordTitle">Word</h2>

          <p id="phonetic" class="phonetic"></p>
        </div>

        <button id="audioBtn" class="audio-btn hidden">
          🔊
        </button>

      </div>


      <div id="meanings"></div>

    </section>


    <footer>

      <div>
        <strong>DICTIONARY API</strong>
        <span>FREE DICTIONARY API</span>
      </div>

      <div>
        <strong>TECH</strong>
        <span>HTML5 / CSS3 / JAVASCRIPT</span>
      </div>

      <div>
        <strong>TASK</strong>
        <span>VEDA TECHNOLOGY // 28</span>
      </div>

    </footer>

  </main>


  <script src="script.js"></script>

</body>
</html>
